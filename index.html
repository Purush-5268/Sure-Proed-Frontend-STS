<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Sure-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sure ProEd | Internship Platform</title>
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('sure_theme_pref') || 'system';
          var isDark = savedTheme === 'dark' || (savedTheme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

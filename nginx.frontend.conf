worker_processes 1;
pid /tmp/sureproed-frontend-nginx.pid;
error_log stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    client_max_body_size 16M;
    client_body_temp_path /tmp/sureproed-client-body;
    proxy_temp_path /tmp/sureproed-proxy;

    server {
        listen 0.0.0.0:3000;
        server_name _;
        root /home/dev1/Student-Tracking-Application-Frontend/dist;
        index index.html;

        location ^~ /api/ {
            return 404;
        }

        location ^~ /media/ {
            return 404;
        }

        location ^~ /ws/ {
            return 404;
        }

        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location = /index.html {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}

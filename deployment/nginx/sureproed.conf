# Reject requests made to the origin IP or to any unknown Host header.
# Keep these blocks as the default servers on the origin VM.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# If Nginx terminates TLS at the origin, give the default TLS server the same
# certificate as the named virtual host. The request is dropped after the TLS
# handshake and is never proxied to Django.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/ssl/certs/sureproed.crt;
    ssl_certificate_key /etc/ssl/private/sureproed.key;

    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.sureproed.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.sureproed.com;

    ssl_certificate /etc/ssl/certs/sureproed.crt;
    ssl_certificate_key /etc/ssl/private/sureproed.key;

    client_max_body_size 16M;

    location /static/ {
        alias /home/dev1/pradeep-backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /media/students/photos/ {
        alias /home/dev1/pradeep-backend/media/students/photos/;
        try_files $uri @django_media;
        access_log off;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /media/students/banners/ {
        alias /home/dev1/pradeep-backend/media/students/banners/;
        try_files $uri @django_media;
        access_log off;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Secure authenticated proxying for confidential student documents
    location ^~ /media/offer_letters/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location ^~ /media/students/resumes/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location /media/ {
        alias /home/dev1/pradeep-backend/media/;
        try_files $uri @django_media;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location @django_media {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

[Service]
# A blank assignment clears the original ExecStart before replacing it.
# Production traffic reaches this VM through the private reverse-proxy gateway.
# UFW must allow that gateway on port 8000 and deny every other source.
ExecStart=
ExecStart=/home/dev1/pradeep-backend/venv/bin/gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker -w 4 --bind 0.0.0.0:8000

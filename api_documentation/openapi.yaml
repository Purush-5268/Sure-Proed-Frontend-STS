      - question-banks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionBankDetail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QuestionBankDetail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QuestionBankDetail'

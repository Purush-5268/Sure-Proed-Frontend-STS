        date_joined:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - date_joined
      - email
      - id
      - is_cohort_suspended
      - last_login
      - suspension_message
      - updated_at
    UserRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        sender_email:
          type: string
          format: email
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        request_number:
          type: string
          readOnly: true
        sender_role:
          type: string
          readOnly: true
          description: 'Role at submission time: STUDENT, MENTOR, VOLUNTEER'
        category:
          $ref: '#/components/schemas/UserRequestCategoryEnum'
        subject:
          type: string
          maxLength: 255
        description:
          type: string
        attachment:
          type: string
          format: uri
          nullable: true
          description: Optional screenshot or document attachment.
        status:
          allOf:
          - $ref: '#/components/schemas/UserRequestStatusEnum'
          readOnly: true
        admin_remarks:
          type: string
          readOnly: true
          nullable: true
          description: Resolution notes or response from Admin.
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        sender:
          type: string
          format: uuid
          readOnly: true
        resolved_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
      required:
      - admin_remarks
      - created_at
      - description
      - id
      - request_number
      - resolved_at
      - resolved_by
      - sender
      - sender_email
      - sender_role
      - status
      - subject
      - updated_at
    UserRequestCategoryEnum:
      enum:
      - TECHNICAL_ISSUE
      - ATTENDANCE
      - COURSE_INQUIRY
      - OFFER_LETTER
      - CERTIFICATE
      - ASSIGNMENT_EXAM
      - VOLUNTEER_JOINING
      - MENTOR_SUPPORT
      - VOLUNTEER_SUPPORT
      - LEAVE_REQUEST
      - OTHER
      type: string
      description: |-
        * `TECHNICAL_ISSUE` - Technical Issue / Bug
        * `ATTENDANCE` - Attendance Correction
        * `COURSE_INQUIRY` - Course / Curriculum Inquiry
        * `OFFER_LETTER` - Offer Letter
        * `CERTIFICATE` - Certificate
        * `ASSIGNMENT_EXAM` - Assignment / Exam Query
        * `VOLUNTEER_JOINING` - Volunteer Joining Request
        * `MENTOR_SUPPORT` - Mentor Support / Class Reschedule
        * `VOLUNTEER_SUPPORT` - Volunteer Support / Session Log
        * `LEAVE_REQUEST` - Leave Request
        * `OTHER` - Other General Request
    UserRequestStatusEnum:
      enum:
      - PENDING
      - IN_PROGRESS
      - RESOLVED
      - REJECTED
      - CLOSED
      type: string
      description: |-
        * `PENDING` - Pending Review
        * `IN_PROGRESS` - In Progress
        * `RESOLVED` - Resolved
        * `REJECTED` - Rejected
        * `CLOSED` - Closed
    VerifyEmailOTPRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        otp:

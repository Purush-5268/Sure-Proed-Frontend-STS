components:
  schemas:
    ActivityTypeEnum:
      enum:
      - TREE_PLANTATION
      - BLOOD_DONATION
      - HELPING_SOCIETY
      - BLOG
      - OPEN_SOURCE
      - MEETUP
      - VOLUNTEER
      - OTHER
      type: string
      description: |-
        * `TREE_PLANTATION` - Tree Plantation
        * `BLOOD_DONATION` - Blood Donation
        * `HELPING_SOCIETY` - Helping Society
        * `BLOG` - Tech Blog Post
        * `OPEN_SOURCE` - Open Source Contribution
        * `MEETUP` - Tech Meetup / Webinar
        * `VOLUNTEER` - Community Volunteering
        * `OTHER` - Other Activity
    Announcement:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        title:
          type: string
          maxLength: 255
        message:
          type: string
        target_audience:
          $ref: '#/components/schemas/TargetAudienceEnum'
        attachment:
          type: string
          format: uri
          nullable: true
          description: Optional document, image, or PDF attachment.
        link_url:
          type: string
          format: uri
          nullable: true
          description: Optional external or internal link URL.
          maxLength: 500
        is_pinned:
          type: boolean
          description: Pinned announcements stay at the top of student dashboards.
        is_active:
          type: boolean
        cohort:
          type: string
          format: uuid
          nullable: true
        created_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
      required:
      - created_at
      - created_by
      - id
      - message
      - title
      - updated_at
    Application:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        application_number:
          type: string
          readOnly: true
        student:
          type: string
          format: uuid
        student_details:
          type: string
          readOnly: true
        course:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ApplicationStatusEnum'
        applied_at:
          type: string
          format: date-time
          readOnly: true
        assigned_cohort:
          type: string
          format: uuid
          nullable: true
        qualified:
          type: boolean
          nullable: true
        qualification_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
        role_verification_status:
          allOf:
          - $ref: '#/components/schemas/RoleVerificationStatusEnum'
          readOnly: true
        role_verified_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        role_verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        role_verification_remarks:
          type: string
          readOnly: true
          nullable: true
        completed_course:
          type: boolean
        completed_at:
          type: string
          format: date-time
          nullable: true
        final_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
        offer_letter_file:
          type: string
          format: uri
          nullable: true
        offer_letter_issued:
          type: boolean
        offer_letter_issued_at:
          type: string
          format: date-time
          nullable: true
        offer_letter_hash:
          type: string
          nullable: true
          maxLength: 100
        remarks:
          type: string
          nullable: true
        pre_screening:
          type: string
          readOnly: true
        pre_screening_interview:
          type: string
          readOnly: true
        screening_exam:
          type: string
          readOnly: true
        student_role_verified:

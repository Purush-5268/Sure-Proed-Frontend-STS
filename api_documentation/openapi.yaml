tags:
- name: Authentication & OAuth
  description: User login, JWT tokens, email verification OTP, and OAuth2 linking
    (LinkedIn & GitHub).
- name: users
  description: User accounts, role assignments (Student, Mentor, Trustee, Company,
    Admin), and profiles.
- name: students
  description: Student profiles, onboarding progress, cohort linkages, and academic
    status.
- name: courses
  description: Academic courses, curricula, and course module management.
- name: cohorts
  description: Active student cohorts, batch assignments, and mentor schedules.
- name: applications
  description: Student admission applications, review workflow, and cohort acceptance.
- name: pre-screenings
  description: Pre-screening assessments, evaluation criteria, and candidate scoring.
- name: pre-screening-interviews
  description: Interview scheduling, panel evaluations, and feedback logs.
- name: community-activities
  description: Student engagement tracking, extracurricular logs, and community events.
- name: attendance
  description: Live class attendance tracking, QR check-ins, automated warning letters,
    and absence summaries.
- name: assignments
  description: Course assignments, tasks, deadlines, and capstone project management.
- name: submissions
  description: Student assignment submissions, mentor evaluations, grading, and feedback.
- name: certificates
  description: Course completion certificates, unique verification hashes, and dynamic
    PDF generation.
- name: exams
  description: Assessments, external exam links, launch tokens, and result callbacks.
- name: module-tests
  description: Module-level test definitions and question criteria.
- name: module-test-submissions
  description: Module test attempts, score recording, and passing validations.
- name: trainings
  description: Live training batches, mentor allocations, and schedule configuration.
- name: training-sessions
  description: Individual live session links (Google Meet), timestamps, and status.
- name: training-attendances
  description: Attendance verification and audit trail for training sessions.
- name: companies
  description: Hiring partner companies and corporate affiliations.
- name: job-postings
  description: Placement drives, job vacancies, criteria, and deadlines.
- name: job-references
  description: Student referrals, recommendation letters, and job application tracking.
- name: volunteers
  description: Mentor and volunteer directory, volunteer tasks, and assistance requests.
- name: question-banks
  description: Question bank management, categories, and automated paper generation.
- name: announcements
  description: Broadcast notifications and cohort-specific announcements.
- name: notifications
  description: User notifications, read/unread states, and Web Push integration.
- name: feedback
  description: Student, mentor, and training feedback surveys and ratings.
- name: faqs
  description: Frequently asked questions and knowledge base management.
- name: requests
  description: Student and mentor support tickets and helpdesk requests.
- name: system-information
  description: Platform health, system metrics, and configuration endpoints.
